[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=#SCREENAREAWIDTH#
SkinHeight=28
DynamicWindowSize=1

[Metadata]
Name=macOS Top Menu Bar
Author=macOSify Win11
Information=Sleek macOS Sonoma style top menu bar for Windows 11
Version=1.0
License=MIT

[Variables]
BarHeight=28
FontName=Segoe UI Variable Text
FontSize=10
TextColor=24,24,27,240
TextHoverColor=10,132,255,255
BgColor=245,245,250,225
BorderColor=210,210,215,180

; --- Measures ---

[MeasureTime]
Measure=Time
Format=%a  %b %d   %I:%M %p

[MeasurePower]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

; --- Visual Meters ---

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#SCREENAREAWIDTH#,#BarHeight# | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

; Apple Logo
[MeterAppleLogo]
Meter=String
X=14
Y=5
FontFace=Segoe Fluent Icons, Segoe MDL2 Assets, Segoe UI Symbol
FontSize=11
FontColor=#TextColor#
Text=[\xE7F8]
AntiAlias=1
ToolTipText=Apple System Menu
LeftMouseUpAction=["explorer.exe" shell:::{2559a1f3-21d7-11d4-bdaf-00c04f60b9f0}]

; Finder Title
[MeterFinder]
Meter=String
X=36
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontWeight=600
FontColor=#TextColor#
Text=Finder
AntiAlias=1
LeftMouseUpAction=["explorer.exe"]

; Menus
[MeterFile]
Meter=String
X=88
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=File
AntiAlias=1

[MeterEdit]
Meter=String
X=122
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=Edit
AntiAlias=1

[MeterView]
Meter=String
X=156
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=View
AntiAlias=1

[MeterGo]
Meter=String
X=195
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=Go
AntiAlias=1

[MeterWindow]
Meter=String
X=223
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=Window
AntiAlias=1

[MeterHelp]
Meter=String
X=280
Y=5
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Text=Help
AntiAlias=1

; --- Right Status Icons ---

[MeterClock]
Meter=String
MeasureName=MeasureTime
X=(#SCREENAREAWIDTH# - 16)
Y=5
StringAlign=Right
FontFace=#FontName#
FontSize=#FontSize#
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ToolTipText=Notification Center

[MeterSpotlight]
Meter=String
X=(#SCREENAREAWIDTH# - 176)
Y=5
FontFace=Segoe Fluent Icons, Segoe MDL2 Assets
FontSize=11
FontColor=#TextColor#
Text=[\xE721]
AntiAlias=1
ToolTipText=Spotlight Search
LeftMouseUpAction=["explorer.exe" "shell:::{2559a1f0-21d7-11d4-bdaf-00c04f60b9f0}"]

[MeterControlCenter]
Meter=String
X=(#SCREENAREAWIDTH# - 200)
Y=5
FontFace=Segoe Fluent Icons, Segoe MDL2 Assets
FontSize=11
FontColor=#TextColor#
Text=[\xE70F]
AntiAlias=1
ToolTipText=Control Center
LeftMouseUpAction=["explorer.exe" "ms-actioncenter:"]

[MeterBattery]
Meter=String
MeasureName=MeasurePower
X=(#SCREENAREAWIDTH# - 224)
Y=5
FontFace=Segoe Fluent Icons, Segoe MDL2 Assets
FontSize=11
FontColor=#TextColor#
Text=[\xEBAA]
AntiAlias=1
ToolTipText=Battery
DynamicVariables=1

[MeterWiFi]
Meter=String
X=(#SCREENAREAWIDTH# - 248)
Y=5
FontFace=Segoe Fluent Icons, Segoe MDL2 Assets
FontSize=11
FontColor=#TextColor#
Text=[\xE701]
AntiAlias=1
ToolTipText=Wi-Fi: Connected
